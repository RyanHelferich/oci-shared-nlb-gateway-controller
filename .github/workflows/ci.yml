name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Go tests
        run: go test -count=1 ./...
      - name: Go vet
        run: go vet ./...
      - name: Package and installer tests
        run: python tests/package/test_tools.py
      - name: Helm chart lint and render
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          helm="$RUNNER_TEMP/linux-amd64/helm"
          cd "$GITHUB_WORKSPACE"
          values=(
            --set-string image.repository=example.invalid/controller
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            --set-string oci.compartmentId=ocid1.compartment.test
            --set-string oci.subnetId=ocid1.subnet.test
            --set-string installationId=ci
            --set gatewayPool.create=true
          )
          "$helm" lint charts/oci-shared-nlb-controller "${values[@]}"
          "$helm" template shared-nlb charts/oci-shared-nlb-controller \
            --namespace test --include-crds "${values[@]}" >/tmp/controller-chart.yaml
      - name: Dependency notices
        run: python scripts/collect-notices.py --check
      - name: Public-tree disclosure and link audit
        run: python scripts/audit-public.py
      - name: Build controller
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o /tmp/controller ./cmd/controller
