apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oci-shared-nlb-controller.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "oci-shared-nlb-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gatewayclasses/status]
    resourceNames: [{{ .Values.gatewayAPI.className | quote }}]
    verbs: [get, patch, update]
