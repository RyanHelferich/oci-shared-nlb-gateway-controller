{{- if and .Values.gatewayAPI.enabled .Values.gatewayAPI.createClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayAPI.className }}
  labels:
    {{- include "oci-shared-nlb-controller.labels" . | nindent 4 }}
spec:
  controllerName: nlb.independent.dev/native-udp
{{- end }}
