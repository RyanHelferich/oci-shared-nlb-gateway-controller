apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oci-shared-nlb-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oci-shared-nlb-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [nlb.independent.dev]
    resources: [nlbpools, tunnelbindings, gatewaypools, nlbpools/status, tunnelbindings/status, gatewaypools/status, nlbpools/finalizers, tunnelbindings/finalizers, gatewaypools/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, pods]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, gateways/status, gateways/finalizers, udproutes, udproutes/status, udproutes/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
