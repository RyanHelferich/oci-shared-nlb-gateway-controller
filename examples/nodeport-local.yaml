# Recommended pilot shape for overlay networking and for VCN-native clusters
# that prefer a worker-backed path. The selected workload must expose TCP health.
apiVersion: nlb.independent.dev/v1alpha1
kind: GatewayPool
metadata:
  name: shared-local
  namespace: YOUR_TUNNEL_NAMESPACE
spec:
  gatewayClassName: oci-native-udp
  # Listener capacity is not a throughput result. Set this from the capacity plan.
  occupancy: 8
  maxGateways: 10
  portStart: 20000
  maxWorkers: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tunnel-local
  namespace: YOUR_TUNNEL_NAMESPACE
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: YOUR_EXISTING_TUNNEL_LABEL
  ports:
    - name: wireguard
      port: 51820
      targetPort: 51820
      protocol: UDP
    - name: health
      port: 9901
      targetPort: 9901
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: tunnel-local
  namespace: YOUR_TUNNEL_NAMESPACE
  annotations:
    nlb.independent.dev/pool: shared-local
    nlb.independent.dev/backend-mode: NodePortLocal
    # This is the TCP Service port. The controller resolves its allocated
    # NodePort and uses that for the OCI NLB health checker.
    nlb.independent.dev/health-port: "9901"
spec:
  rules:
    - backendRefs:
        - name: tunnel-local
          port: 51820
